name: ZAP Security Scan

on:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start web server
        run: |
          python3 -m http.server 8000 &
          sleep 5

      - name: Run ZAP scan
        uses: zaproxy/action-baseline@v0.13.0
        with:
          target: 'http://127.0.0.1:8000'
          fail_action: false
